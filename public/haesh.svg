<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" role="img" aria-label="האש שלי — My Fire">
  <defs>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a1500"/>
      <stop offset=".28" stop-color="#d63a00"/>
      <stop offset=".55" stop-color="#ff7a00"/>
      <stop offset=".8" stop-color="#ffc03a"/>
      <stop offset="1" stop-color="#ffe89a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="72%" r="60%">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>
  <ellipse cx="100" cy="70" rx="80" ry="52" fill="url(#glow)"/>
  <!-- flame silhouette rising behind the words -->
  <path d="M100 8c9 20-6 26 4 40 6 8 2 16-3 20 3-9-3-13-6-9-4 6 1 13 6 18-14-3-22-15-20-30 1-9 8-13 6-24-1-5 4-9 13-15z"
        fill="url(#fire)" opacity=".9" filter="url(#soft)"/>
  <path d="M86 34c5 10-4 16 2 24 3 5 1 10-2 12 2-6-2-8-4-5-2 4 0 8 4 11-8-2-13-9-12-18 1-6 6-8 5-15 0-3 3-5 7-6z"
        fill="url(#fire)" opacity=".65"/>
  <!-- the words, in fire -->
  <text x="100" y="98" text-anchor="middle" font-family="'Assistant','Segoe UI',sans-serif"
        font-weight="800" font-size="34" fill="url(#fire)" direction="rtl">האש שלי</text>
</svg>
